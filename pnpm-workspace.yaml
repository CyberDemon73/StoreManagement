allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # postinstall only prints a funding banner (pulled in by jspdf)
  core-js: false
# Security overrides (see docs/DECISIONS.md): postcss pinned low by next 15.5; tinypool dev-only via vitest 3.
overrides:
  postcss: '^8.5.18'
  zod: '^4.6.6'
  'vitest>tinypool': '^2.1.2'
